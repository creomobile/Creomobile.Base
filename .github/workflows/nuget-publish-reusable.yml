name: NuGet Publish Reusable

on:
  workflow_call:
    inputs:
      package_id:
        description: NuGet package ID
        required: true
        type: string
      project_path:
        description: Path to the project file
        required: true
        type: string
      tag_prefix:
        description: Tag prefix before version, for example 'creomobile.data.abstractions/'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate tag format and extract version
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${GITHUB_REF_NAME}"
          expected_prefix="${{ inputs.tag_prefix }}v"

          if [[ "${tag_name}" != ${expected_prefix}* ]]; then
            echo "Tag '${tag_name}' does not match expected prefix '${expected_prefix}'."
            exit 1
          fi

          package_version="${tag_name#${expected_prefix}}"

          if [[ ! "${package_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only stable SemVer tags are allowed (major.minor.patch). Received: ${package_version}"
            exit 1
          fi

          echo "package_version=${package_version}" >> "${GITHUB_OUTPUT}"

      - name: Ensure tagged commit is on master
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master --no-tags --prune

          tagged_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"

          if ! git merge-base --is-ancestor "${tagged_commit}" "origin/master"; then
            echo "Tag commit is not reachable from origin/master. Releases are allowed only from master."
            exit 1
          fi

      - name: Validate project version matches tag
        shell: pwsh
        run: |
          [xml]$proj = Get-Content "${{ inputs.project_path }}"
          $projectVersion = $proj.Project.PropertyGroup.Version | Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($projectVersion)) {
            throw "Version element was not found in '${{ inputs.project_path }}'."
          }

          $tagVersion = "${{ steps.tag.outputs.package_version }}"

          if ($projectVersion -ne $tagVersion) {
            throw "Version mismatch. Project has '$projectVersion', tag has '$tagVersion'."
          }

      - name: Restore
        run: dotnet restore "${{ inputs.project_path }}"

      - name: Build
        run: dotnet build "${{ inputs.project_path }}" -c Release --no-restore

      - name: Pack
        run: dotnet pack "${{ inputs.project_path }}" -c Release --no-build -o artifacts

      - name: Push package to nuget.org
        run: |
          dotnet nuget push "artifacts/${{ inputs.package_id }}.${{ steps.tag.outputs.package_version }}.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
          dotnet nuget push "artifacts/${{ inputs.package_id }}.${{ steps.tag.outputs.package_version }}.snupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
